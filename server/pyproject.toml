[project]
name = "execflow"
version = "0.1.0"
description = "ExecFlow analytics backend: file ingestion, deterministic analytics, sub-agent reporting, memory"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["execflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
