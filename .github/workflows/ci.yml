name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:services
      - run: npm run test:backup
      - name: Install disposable pinned browser tooling
        env:
          BROWSER_TOOL_ROOT: ${{ runner.temp }}/exeflow-browser
        run: |
          npm install --prefix "$BROWSER_TOOL_ROOT" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$BROWSER_TOOL_ROOT/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify standalone bilingual synthetic portfolio
        env:
          BROWSER_TOOL_ROOT: ${{ runner.temp }}/exeflow-browser
        run: node scripts/verify-jarvis-browser.mjs
      - name: Verify local integration workflow with synthetic adapters
        env:
          BROWSER_TOOL_ROOT: ${{ runner.temp }}/exeflow-browser
        run: node scripts/VerifyIntegrations.mjs
      - name: Verify offline commitment capture and closure
        env:
          BROWSER_TOOL_ROOT: ${{ runner.temp }}/exeflow-browser
        run: node scripts/verify-commitments-browser.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "./server[dev]"
      - run: cd server && python -m pytest -q
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: commitments-browser-failure
          path: artifacts/commitments/*.zip
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: rmd-dashboard
          path: dist/rmd-dashboard.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-synthetic-browser
          path: artifacts/jarvis/*.png
          if-no-files-found: ignore
          retention-days: 7
  windows:
    name: Windows local launcher and recovery
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:services
      - run: npm run test:backup
      - run: npm run test:local
      - run: npm run test:windows
      - name: Install disposable browser test tools
        shell: pwsh
        run: npm install --prefix "$env:RUNNER_TEMP/ExecFlowBrowser" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Verify local integration workflow on Windows
        shell: pwsh
        run: |
          $env:BROWSER_TOOL_ROOT = "$env:RUNNER_TEMP/ExecFlowBrowser"
          $env:EXECFLOW_BROWSER_EXECUTABLE = "${env:ProgramFiles}/Google/Chrome/Application/chrome.exe"
          node scripts/VerifyIntegrations.mjs
      - name: Verify complete browser restart and JSON recovery
        shell: pwsh
        run: |
          $env:BROWSER_TOOL_ROOT = "$env:RUNNER_TEMP/ExecFlowBrowser"
          $env:EXECFLOW_BROWSER_EXECUTABLE = "${env:ProgramFiles}/Google/Chrome/Application/chrome.exe"
          if (!(Test-Path $env:EXECFLOW_BROWSER_EXECUTABLE)) { throw "Preinstalled Chrome is unavailable" }
          node scripts/VerifyLocalPersistence.mjs
      - name: Build public distribution with an empty demonstration portfolio
        run: npm run build:release
      - name: Verify public distribution browser workflow
        shell: pwsh
        run: |
          $env:BROWSER_TOOL_ROOT = "$env:RUNNER_TEMP/ExecFlowBrowser"
          $env:EXECFLOW_BROWSER_EXECUTABLE = "${env:ProgramFiles}/Google/Chrome/Application/chrome.exe"
          node scripts/VerifyLocalPersistence.mjs
      - name: Verify public integration workflow
        shell: pwsh
        run: |
          $env:BROWSER_TOOL_ROOT = "$env:RUNNER_TEMP/ExecFlowBrowser"
          $env:EXECFLOW_BROWSER_EXECUTABLE = "${env:ProgramFiles}/Google/Chrome/Application/chrome.exe"
          node scripts/VerifyIntegrations.mjs
      - run: npm run package:windows
      - name: Extract and exercise the actual Windows package
        shell: pwsh
        run: |
          $packageRoot = "$env:RUNNER_TEMP/ExecFlow Distribution"
          Expand-Archive -Path artifacts/Release/ExecFlowWindowsPackage.zip -DestinationPath $packageRoot
          Push-Location "$packageRoot/ExecFlowWindowsPackage"
          node scripts/VerifyWindowsLauncher.mjs
          $acceptanceExit = $LASTEXITCODE
          Pop-Location
          if ($acceptanceExit -ne 0) { exit $acceptanceExit }
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsDistribution
          path: artifacts/Release/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WindowsLocalAcceptance
          path: artifacts/local/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish tested local Windows distribution
    needs: [build, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WindowsDistribution
          path: Release
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const tag = `v${version}`;
            const { owner, repo } = context.repo;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              if (!release.draft) {
                core.info(`Release ${tag} already exists; existing assets will not be overwritten.`);
                return;
              }
              if (release.target_commitish !== context.sha) throw new Error('An existing draft targets another commit; refusing to replace it.');
            } catch (error) { if (error.status !== 404) throw error; }
            if (!release) release = (await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, target_commitish: context.sha,
              name: `ExecFlow ${version} local executive workspace`, draft: true, prerelease: true,
              body: fs.readFileSync('docs/Release Scope.md', 'utf8') + `\n\nValidated source: ${context.sha}\nWorkflow: https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
            })).data;
            for (const name of ['ExecFlowWindowsPackage.zip', 'Checksums.txt']) {
              const data = fs.readFileSync(`Release/${name}`);
              const existing = release.assets.find(asset => asset.name === name);
              if (existing) {
                const digest = `sha256:${require('crypto').createHash('sha256').update(data).digest('hex')}`;
                if (existing.digest !== digest) throw new Error(`Existing draft asset ${name} could not be verified; refusing replacement.`);
                continue;
              }
              await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id: release.id, name, data,
                headers: { 'content-type': name.endsWith('.zip') ? 'application/zip' : 'text/plain', 'content-length': data.length } });
            }
            await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, draft: false });
            core.info(`Published ${release.html_url}`);
