name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "./server[dev]"
      - run: cd server && python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: rmd-dashboard
          path: dist/rmd-dashboard.html
