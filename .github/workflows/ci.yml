name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install disposable pinned browser tooling
        env:
          BROWSER_TOOL_ROOT: ${{ runner.temp }}/exeflow-browser
        run: |
          npm install --prefix "$BROWSER_TOOL_ROOT" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$BROWSER_TOOL_ROOT/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify standalone bilingual synthetic portfolio
        env:
          BROWSER_TOOL_ROOT: ${{ runner.temp }}/exeflow-browser
        run: node scripts/verify-jarvis-browser.mjs
      - name: Verify offline commitment capture and closure
        env:
          BROWSER_TOOL_ROOT: ${{ runner.temp }}/exeflow-browser
        run: node scripts/verify-commitments-browser.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "./server[dev]"
      - run: cd server && python -m pytest -q
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: commitments-browser-failure
          path: artifacts/commitments/*.zip
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: rmd-dashboard
          path: dist/rmd-dashboard.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-synthetic-browser
          path: artifacts/jarvis/*.png
          if-no-files-found: ignore
          retention-days: 7
  windows:
    name: Windows local launcher and recovery
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:local
      - run: npm run test:windows
      - name: Install disposable browser test tools
        shell: pwsh
        run: npm install --prefix "$env:RUNNER_TEMP/ExecFlowBrowser" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Verify complete browser restart and JSON recovery
        shell: pwsh
        run: |
          $env:BROWSER_TOOL_ROOT = "$env:RUNNER_TEMP/ExecFlowBrowser"
          $env:EXECFLOW_BROWSER_EXECUTABLE = "${env:ProgramFiles}/Google/Chrome/Application/chrome.exe"
          if (!(Test-Path $env:EXECFLOW_BROWSER_EXECUTABLE)) { throw "Preinstalled Chrome is unavailable" }
          node scripts/VerifyLocalPersistence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WindowsLocalAcceptance
          path: artifacts/local/
          if-no-files-found: warn
          retention-days: 14
