services:
  execflow:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    volumes:
      - execflow-data:/data
    restart: unless-stopped

  # Local Ollama requires the API process to share its loopback namespace.
  # Use the documented native local setup; this Compose template is mock-only.

volumes:
  execflow-data:

