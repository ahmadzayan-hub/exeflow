services:
  execflow:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    volumes:
      - execflow-data:/data
    restart: unless-stopped

  # Optional fully local model server. Pull a model once: docker compose exec ollama ollama pull hermes3
  # then set EXECFLOW_PROVIDER=ollama and OLLAMA_BASE_URL=http://ollama:11434/v1 in .env
  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    ports: ["11434:11434"]
    volumes:
      - ollama:/root/.ollama

volumes:
  execflow-data:
  ollama:
