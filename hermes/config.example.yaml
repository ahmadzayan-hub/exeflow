# ~/.hermes/config.yaml  (merge into your existing file)
#
# ExecFlow agentic OS layout:
#   orchestrator  = Hermes Agent (memory, skills, delegation) on a Hermes 4 model via Nous Portal
#   sub-agents    = delegate_task children on Groq (open-weight gpt-oss-120b, fast and cheap)
#   analytics     = ExecFlow service (deterministic numbers) reached through the execflow-reporting skill
#
# Keys live in ~/.hermes/.env (see env.example). Verify current model ids at
# https://console.groq.com/docs/models and https://portal.nousresearch.com before first run.

providers:
  groq:
    api: https://api.groq.com/openai/v1
    key_env: GROQ_API_KEY
    default_model: openai/gpt-oss-120b
    models:
      openai/gpt-oss-120b:
        context_length: 131072
      openai/gpt-oss-20b:
        context_length: 131072

model:
  # Option A (recommended): Hermes 4 on Nous Portal as the orchestrator
  provider: nous
  default: Hermes-4-70B
  # Option B: everything on Groq (no Nous account)
  # provider: custom:groq
  # default: openai/gpt-oss-120b
  # Option C: fully local, no data leaves the machine (needs a capable machine)
  # provider: custom
  # base_url: http://localhost:11434/v1
  # default: hermes3
  # context_length: 64000

delegation:
  # Sub-agents run on Groq regardless of the orchestrator model.
  base_url: https://api.groq.com/openai/v1
  api_key: ${GROQ_API_KEY}
  model: openai/gpt-oss-120b
  max_concurrent_children: 3
  max_iterations: 40
  child_timeout_seconds: 600

auxiliary:
  review:
    provider: custom:groq
    model: openai/gpt-oss-120b

memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false

skills:
  external_dirs:
    - ${EXECFLOW_REPO}/hermes/skills

gateway:
  api_server:
    enabled: true
    port: 8642
    host: 127.0.0.1
    max_concurrent_runs: 4
