# Optional, offline-oriented Hermes configuration example. Do not apply blindly.
# No gateway or monitoring is started by this repository. Before any local use,
# the operator must disable Ollama cloud features and deny its outbound traffic.
# Review the installed Hermes version's configuration contract before use.
model:
  provider: custom
  base_url: http://127.0.0.1:11434/v1
  default: hermes3

delegation:
  base_url: http://127.0.0.1:11434/v1
  model: hermes3
  max_concurrent_children: 3
  max_iterations: 40
  child_timeout_seconds: 600

auxiliary:
  review:
    provider: custom
    base_url: http://127.0.0.1:11434/v1
    model: hermes3

memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false

skills:
  external_dirs:
    - ${EXECFLOW_REPO}/hermes/skills

gateway:
  api_server:
    enabled: false
    host: 127.0.0.1
    port: 8642

# The ExecFlow dashboard proxy is intentionally disabled pending independently
# verified inbound authentication. No service credential belongs in that proxy.
